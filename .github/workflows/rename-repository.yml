# GENEROVANO gov-sync.sh -- needitovat v gov repu
# Workflow rename-repository: issue s labelem rename-repo → přejmenování
# spravovaného repa uvnitř projektu (docs/implementovano/navrh/gh-rename.md): rename +
# efektivní politika pod novým jménem + přesun ukazatele state/ a řádku
# completion manifestu; topic ghp-* se nemění. Bezpečnostní schéma shodné
# s move-repository.yml: parse job čte event soubor (tělo issue se nikdy
# neinterpoluje do run:), execute dostává zvalidované hodnoty přes env.
# Concurrency zamyká staré jméno repa (entitu, kterou workflow mění); závod
# o nové jméno kryje validace volnosti a viditelné selhání rename API.
name: rename-repository

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'rename-repo')
    runs-on: ubuntu-latest
    environment: bot
    outputs:
      result: ${{ steps.parse.outputs.result }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      project_key: ${{ steps.parse.outputs.project_key }}
      gh_name: ${{ steps.parse.outputs.gh_name }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
      new_gh_name: ${{ steps.parse.outputs.new_gh_name }}
      new_repo_name: ${{ steps.parse.outputs.new_repo_name }}
      redirect: ${{ steps.parse.outputs.redirect }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse a autorizace issue
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
        run: bash bin/gov-rename-repository.sh --parse

  execute:
    needs: parse
    if: needs.parse.outputs.result == 'ok'
    runs-on: ubuntu-latest
    environment: bot
    concurrency:
      group: repo-${{ needs.parse.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOV_BOT_TOKEN }}
      - name: Identita bota pro commity /state/
        run: |
          git config user.name "governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
      - name: Přejmenování repa
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          PROJECT_KEY: ${{ needs.parse.outputs.project_key }}
          GH_NAME: ${{ needs.parse.outputs.gh_name }}
          NEW_GH_NAME: ${{ needs.parse.outputs.new_gh_name }}
          REDIRECT: ${{ needs.parse.outputs.redirect }}
          ISSUE_NUMBER: ${{ needs.parse.outputs.issue_number }}
        run: bash bin/gov-rename-repository.sh --execute "$PROJECT_KEY" "$GH_NAME" "$NEW_GH_NAME" "$REDIRECT" "$ISSUE_NUMBER"
