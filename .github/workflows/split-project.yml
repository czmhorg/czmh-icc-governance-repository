# GENEROVANO gov-sync.sh -- needitovat v gov repu
# Workflow split-project: hromadný přesun rep projektu podle mapy
# splits/*.tsv schválené PR (docs/implementovano/navrh/rozdeleni-projektu.md, fáze 2).
# Vstupy workflow_dispatch tečou přes env a validují se regexy v entry
# skriptu (žádná interpolace do run:). Sekvenční, fail-fast, restartovatelný
# – nový dispatch přeskočí hotová repa a dokončí polopřesunutá. Spouštět
# mimo okno daily-reconcile (cron 01:00 UTC), ať report nešumí přechodnými
# stavy.
name: split-project

on:
  workflow_dispatch:
    inputs:
      map:
        description: Cesta k mapě v gov repu (splits/<název>.tsv)
        type: string
        required: true
      project_key:
        description: Zdrojový projectKey
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: split-project

jobs:
  split:
    runs-on: ubuntu-latest
    environment: bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOV_BOT_TOKEN }}
      - name: Identita bota pro commity /state/
        run: |
          git config user.name "governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
      - name: Hromadný přesun dle mapy
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          MAP: ${{ inputs.map }}
          PROJECT_KEY: ${{ inputs.project_key }}
        run: bash bin/gov-split-project.sh --map "$MAP" --project "$PROJECT_KEY"
