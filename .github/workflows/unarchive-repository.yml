# GENEROVANO gov-sync.sh -- needitovat v gov repu
# Workflow unarchive-repository: governance issue unarchive-repo → dearchivace
# spravovaného repa + okamžitá aplikace policy včetně odebrání týmů dle
# zmrazeného ukazatele /state/. Volá ho dispatcher issue-dispatch.yml přes
# workflow_call podle prefixu titulku `unarchive-repo: ` (joby v jeho běhu,
# event issues volajícího; vlastní trigger issues nemá). Bezpečnostní schéma
# shodné s new-repository.yml.
name: unarchive-repository

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    environment: bot
    outputs:
      result: ${{ steps.parse.outputs.result }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      project_key: ${{ steps.parse.outputs.project_key }}
      gh_name: ${{ steps.parse.outputs.gh_name }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse a autorizace issue
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
        run: bash bin/gov-unarchive-repository.sh --parse

  execute:
    needs: parse
    if: needs.parse.outputs.result == 'ok'
    runs-on: ubuntu-latest
    environment: bot
    concurrency:
      group: repo-${{ needs.parse.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOV_BOT_TOKEN }}
      - name: Identita bota pro commity /state/
        run: |
          git config user.name "governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
      - name: Dearchivace repa
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          PROJECT_KEY: ${{ needs.parse.outputs.project_key }}
          GH_NAME: ${{ needs.parse.outputs.gh_name }}
          ISSUE_NUMBER: ${{ needs.parse.outputs.issue_number }}
        run: bash bin/gov-unarchive-repository.sh --execute "$PROJECT_KEY" "$GH_NAME" "$ISSUE_NUMBER"
