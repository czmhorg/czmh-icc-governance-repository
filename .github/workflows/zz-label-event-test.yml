# DOCASNY overovaci workflow (piskoviste, 2026-10-09) - po overeni smazat.
# Otazka: jake udalosti issues prijdou pri zalozeni issue s labelem v jednom
# volani (gh issue create --label) a zda payload udalosti opened label obsahuje.
name: zz-label-event-test

on:
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Event
        env:
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "action=$ACTION issue=$ISSUE label=$LABEL labels_in_payload=[$LABELS]"
