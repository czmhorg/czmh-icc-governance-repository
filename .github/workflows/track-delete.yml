# GENEROVANO gov-sync.sh -- needitovat v gov repu
# Workflow track-delete: issue s labelem track-delete → sledování zániku repa
# po žádosti o smazání (defs/defs-governance-repo.md). Bezpečnostní schéma
# shodné s new-repository.yml (parse job čte event soubor, execute dostává
# zvalidované hodnoty přes env). Workflow nic na GitHubu nemaže – polluje
# existenci repa a po prokázaném 404 uklidí ukazatel /state/ a řádek
# completion manifestu (push přes checkout s tokenem + identita bota).
# Concurrency group repo-<repo_name> serializuje úklid se souběžnou
# new/archive/unarchive operací nad týmž repem.
name: track-delete

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'track-delete')
    runs-on: ubuntu-latest
    environment: bot
    outputs:
      result: ${{ steps.parse.outputs.result }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      project_key: ${{ steps.parse.outputs.project_key }}
      gh_name: ${{ steps.parse.outputs.gh_name }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse issue
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
        run: bash bin/gov-track-delete.sh --parse

  execute:
    needs: parse
    if: needs.parse.outputs.result == 'ok'
    runs-on: ubuntu-latest
    environment: bot
    timeout-minutes: 15
    concurrency:
      group: repo-${{ needs.parse.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOV_BOT_TOKEN }}
      - name: Identita bota pro commity /state/
        run: |
          git config user.name "governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
      - name: Sledování zániku repa a úklid
        env:
          GH_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GOV_BOT_TOKEN }}
          PROJECT_KEY: ${{ needs.parse.outputs.project_key }}
          GH_NAME: ${{ needs.parse.outputs.gh_name }}
          ISSUE_NUMBER: ${{ needs.parse.outputs.issue_number }}
        run: bash bin/gov-track-delete.sh --execute "$PROJECT_KEY" "$GH_NAME" "$ISSUE_NUMBER"
