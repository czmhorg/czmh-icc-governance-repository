# Šablona workflow governance (defs/defs.md: workflow repa). Po pushi do
# release/* otevře PR do všech vyšších release/* a do výchozí větve repa
# (default_branch z payloadu události) a zapne auto-merge; merge chráněné
# větve dokončí GitHub po schválení dle rulesetu. Na větvi bez ochrany
# auto-merge zapnout nejde (GraphQL chyba), PR se sloučí rovnou. Vyžaduje
# příznaky repa allow_auto_merge=true a actions_create_pr=true (klíče projektu
# vedle klíče workflows). Používá jen GITHUB_TOKEN; merge tímto tokenem
# nespouští další workflows.
name: "release-merge-up (governance): merge release do vyšších release větví a výchozí větve"

on:
  push:
    branches: ['release/*']

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-up:
    runs-on: ubuntu-latest
    steps:
      - name: Otevřít PR do vyšších release větví a výchozí větve, zapnout auto-merge
        shell: bash
        env:
          # gh čte token podle hostu: github.com z GH_TOKEN, GHES
          # z GH_ENTERPRISE_TOKEN (docs/github/gh-token-vs-gh-enterprise-token.md).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          branches=$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          # Cíle = vyšší release/* (sort -V: release/1.10 > release/1.9) + výchozí větev repa,
          # není-li pushnutou větví a není-li už mezi nimi (výchozí větev může být sama release/*).
          targets=$(grep '^release/' <<< "$branches" | sort -V \
            | awk -v cur="$BRANCH" 'f{print} $0==cur{f=1}')
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "$BRANCH" ] \
              && ! grep -qxF -- "$DEFAULT_BRANCH" <<< "$targets"; then
            targets="${targets:+$targets$'\n'}$DEFAULT_BRANCH"
          fi
          [ -n "$targets" ] || { echo "Žádná vyšší release větev ani výchozí větev ($DEFAULT_BRANCH) – nic k otevření."; exit 0; }
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            echo "Cílová větev: $target"
            pr=$(gh pr list --base "$target" --head "$BRANCH" --state open --json number -q '.[0].number')
            if [ -z "$pr" ]; then
              ahead=$(gh api "repos/$GH_REPO/compare/$target...$BRANCH" --jq '.ahead_by')
              if [ "$ahead" = "0" ]; then
                echo "$BRANCH nemá pro $target žádné nové commity – přeskočeno."
                continue
              fi
              # gh pr create vypisuje URL PR (gh < 2.76 nemá --json; gh pr merge URL
              # přijímá). Souběh dvou pushů: PR už existuje → vzít ho z výpisu.
              pr=$(gh pr create --base "$target" --head "$BRANCH" \
                --title "Merge up $BRANCH into $target" \
                --body "Automatický PR workflow release-merge-up (governance) po pushi do $BRANCH.") \
                || pr=$(gh pr list --base "$target" --head "$BRANCH" --state open --json url -q '.[0].url')
            fi
            # Chráněná větev: auto-merge (opakované zapnutí je no-op). Větev bez
            # ochrany auto-merge nedovolí – PR se sloučí rovnou. Selhání obou
            # = chyba běhu (viditelná v Actions).
            if gh pr merge "$pr" --auto --merge; then
              echo "Auto-merge zapnut: $pr"
            else
              echo "Auto-merge nelze zapnout (větev bez ochrany) – slučuji rovnou: $pr"
              gh pr merge "$pr" --merge
            fi
          done <<< "$targets"
