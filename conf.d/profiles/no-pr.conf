# Profil bez PR: ruleset jen zakazuje force push a smazání větve, změny se
# pushují přímo. Pole review níže jsou povinná a validují se, do rulesetu
# bez pravidla pull_request se nepromítají.
# Vyžadované status checks (JSON: strict + contexts).
required_status_checks={"strict":true,"contexts":[]}
# Vynucovat pravidla i pro adminy (true/false).
enforce_admins=true
# Zneplatnit schválení review po novém pushi (true/false) — bez PR bez účinku.
dismiss_stale_reviews=false
# Vyžadovat review od code owners (true/false) — bez PR bez účinku.
require_code_owner_reviews=false
# Minimální počet schvalujících review — bez PR bez účinku.
required_approving_review_count=0
# Povolit force push (true/false).
allow_force_pushes=false
# Povolit smazání větve (true/false).
allow_deletions=false
# Vyžadovat lineární historii (true/false).
required_linear_history=false
# Vzor cílených větví rulesetu; ~DEFAULT_BRANCH = výchozí větev repa.
branches=~DEFAULT_BRANCH
# Vyžadovat PR pro změny cílených větví (true/false, nepovinné, výchozí true);
# false = ruleset bez pravidla pull_request; atribut |jenkins v rulesets se
# u takového profilu promítne jen do Jenkins collaboratora, ne do bypass actora.
require_pull_request=false
