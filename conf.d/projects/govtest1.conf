# Doména projektu — odkaz na domains/<MHN>/<typ>.conf.
display_name=Testovaci projekt govtest1
domain=MHN9/online
repository_teams=test-gov-admins|admin,test-pr-reviewers|push
pr_reviewers_team=test-pr-reviewers
repository_creators=test-gov-admins
repository_archivers=test-gov-admins
rulesets=default,release
# Výchozí větev nově zakládaného repa projektu (nepovinné) — workflow new-repository
# větev z auto_init přejmenuje; uplatní se jen při založení repa.
default_branch=master
# Šablony workflow rep projektu, CSV názvů (nepovinné) — odkaz na workflows/<název>.yml.
# Každé nearchivované repo projektu mimo migraci dostane do výchozí větve soubor
# .github/workflows/mh-workflow-<název>.yml s hlavičkou GENEROVANO; reconcile ho
# drží (smazaný obnoví, upravený přepíše), soubor s prefixem bez hlavičky jen
# hlásí. Bez klíče žádné spravované workflow (osiřelé soubory s hlavičkou se
# odeberou). Jednotlivé repo může klíč přepsat nastavením repa (workflows=none
# = bez spravovaných workflow). Šablona release-merge-up vyžaduje příznaky
# allow_auto_merge=true a actions_create_pr=true.
workflows=release-merge-up
# Příznaky repa (nepovinné, true|false): allow_auto_merge = repo povoluje
# auto-merge PR; actions_create_pr = GitHub Actions smí zakládat a schvalovat PR
# (strop je politika organizace). Bez klíče governance nastavení nečte ani
# nemění; odebrání klíče hodnotu v GitHubu nevrací (vypnutí = false).
allow_auto_merge=true
actions_create_pr=true
