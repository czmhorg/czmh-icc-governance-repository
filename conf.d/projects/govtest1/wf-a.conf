# Nastavení repa czmh-icc-govtest1-wf-a (defs/defs.md, nastavení repa): přepisuje
# vybrané klíče projektu govtest1. Klíč zde neuvedený = platí hodnota projektu.
# Povolené klíče: rulesets, pr_reviewers_team, default_branch, repository_teams_add,
# webhook_url, webhook_events, workflows, allow_auto_merge, actions_create_pr.
# Pilot šablony release-merge-up: výchozí větev develop, aby release větve
# odbočené z develop zdědily soubor workflow.
# Výchozí větev tohoto repa při založení (přepisuje default_branch projektu,
# nepovinné); uplatní se jen při založení repa, existující repo větev nemění.
default_branch=develop
# Šablony workflow tohoto repa, CSV názvů (přepisuje workflows projektu,
# nepovinné); none = bez spravovaných workflow (soubory s hlavičkou se odeberou).
workflows=none
# Příznaky repa tohoto repa (přepisují allow_auto_merge / actions_create_pr
# projektu, nepovinné; true|false).
#allow_auto_merge=true
#actions_create_pr=true
